services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: frontline
      MYSQL_USER: frontline
      MYSQL_PASSWORD: frontline_password
      MYSQL_ROOT_PASSWORD: frontline_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:?Copy .env.docker.example to .env.docker and add the hCaptcha site key}
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: mysql://frontline:frontline_password@db:3306/frontline
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      EMAIL_SERVER_HOST: mailpit
      EMAIL_SERVER_PORT: 1025
      EMAIL_SERVER_USER: dev
      EMAIL_SERVER_PASSWORD: dev
      EMAIL_FROM: no-reply@frontline.local
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mysql_data:
